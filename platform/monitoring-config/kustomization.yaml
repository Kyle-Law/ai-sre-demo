apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_alert: "1"

configMapGenerator:
  - name: ai-sre-alert-rules
    files:
      - alert-rules.yaml
  - name: ai-sre-contact-points
    files:
      - contact-points.yaml
  - name: ai-sre-notification-policies
    files:
      - notification-policies.yaml
