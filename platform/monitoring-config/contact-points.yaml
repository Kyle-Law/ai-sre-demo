apiVersion: 1
contactPoints:
  - orgId: 1
    name: jira-bridge
    receivers:
      - uid: jira-bridge-webhook
        type: webhook
        disableResolveMessage: false
        settings:
          # In-cluster alert bridge (platform/ai-sre/alert-bridge). A NetworkPolicy
          # only lets the monitoring namespace reach it.
          url: http://alert-bridge.ai-sre.svc.cluster.local:8080/grafana
          httpMethod: POST
          maxAlerts: 20
