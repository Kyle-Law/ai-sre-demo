# Values for kube-prometheus-stack, tuned for a single-node k3s demo cluster.

crds:
  enabled: true

# Grafana-managed alerting replaces Alertmanager in this demo.
alertmanager:
  enabled: false

# Keep the demo quiet: only our own Grafana rules should raise tickets.
defaultRules:
  create: false

# k3s embeds these components; scraping them only produces "target down" noise.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

prometheus:
  prometheusSpec:
    retention: 3d
    scrapeInterval: 15s
    evaluationInterval: 15s
    resources:
      requests:
        cpu: 100m
        memory: 512Mi

grafana:
  # Admin credentials come from a Secret created by infra/cluster-vm/install.sh
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  service:
    type: NodePort
    nodePort: 30300
  grafana.ini:
    server:
      # Used to build links in alert notifications (and therefore in Jira).
      root_url: GRAFANA_PUBLIC_URL
    unified_alerting:
      enabled: true
    users:
      viewers_can_edit: false
    auth.anonymous:
      enabled: false
  sidecar:
    datasources:
      uid: prometheus
    alerts:
      # Loads ConfigMaps labelled grafana_alert=1 (platform/monitoring-config)
      enabled: true
      label: grafana_alert
      labelValue: "1"
