# The controller may create Jobs in namespace ai-sre. Without a guard, anything
# that can create a Job there could run it as any ServiceAccount, with any image
# or Secret. This policy pins every Job in ai-sre to the read-only investigator.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ai-sre-investigator-jobs
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs"]
  variables:
    - name: pod
      expression: object.spec.template.spec
  validations:
    # serviceAccount is the deprecated alias of serviceAccountName; check both.
    - expression: >-
        has(variables.pod.serviceAccountName) && variables.pod.serviceAccountName == 'ai-sre-agent' &&
        (!has(variables.pod.serviceAccount) || variables.pod.serviceAccount == 'ai-sre-agent')
      message: "Jobs in ai-sre must run as the read-only ServiceAccount ai-sre-agent"
    - expression: "variables.pod.containers.all(c, c.image.startsWith('ai-sre-agent:'))"
      message: "Jobs in ai-sre may only run the ai-sre-agent image"
    - expression: "!has(variables.pod.initContainers)"
      message: "Jobs in ai-sre may not have init containers"
    - expression: >-
        variables.pod.containers.all(c, !has(c.envFrom) ||
        c.envFrom.all(e, has(e.secretRef) && e.secretRef.name == 'investigator-credentials'))
      message: "Jobs in ai-sre may only load the investigator-credentials Secret"
    - expression: "!has(variables.pod.volumes) || variables.pod.volumes.all(v, has(v.emptyDir))"
      message: "Jobs in ai-sre may only mount emptyDir volumes"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ai-sre-investigator-jobs
spec:
  policyName: ai-sre-investigator-jobs
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: ai-sre
