name: pr-checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-manifests:
    name: validate-manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform
      - name: Render and validate kustomizations
        run: |
          set -euo pipefail
          for dir in 06-demo-app/manifests 07-alert-rules/manifests 08-jira-integration/manifests 09-agent-access/manifests; do
            echo "::group::$dir"
            kubectl kustomize "$dir" > rendered.yaml
            kubeconform -strict -summary -ignore-missing-schemas rendered.yaml
            echo "::endgroup::"
          done
      - name: Policy - no privileged or secret-bearing resources in the demo app
        run: |
          set -euo pipefail
          kubectl kustomize 06-demo-app/manifests > shop.yaml
          if grep -Eq '^kind: (Secret|Role|RoleBinding|ClusterRole|ClusterRoleBinding|ServiceAccount)$' shop.yaml; then
            echo "::error::06-demo-app/manifests must not contain Secrets or RBAC objects"; exit 1
          fi
          if grep -Eq 'privileged: true|hostNetwork: true|hostPID: true' shop.yaml; then
            echo "::error::privileged pod settings are not allowed in the demo app"; exit 1
          fi

  agent-scope-guard:
    name: agent-scope-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Agent PRs may only touch 06-demo-app/manifests/ and incidents/
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          AGENT: ${{ vars.AGENT_GITHUB_LOGIN }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ -z "$AGENT" || "$AUTHOR" != "$AGENT" ]]; then
            echo "PR by $AUTHOR (not the agent): scope guard not applicable."; exit 0
          fi
          echo "PR opened by the AI agent ($AUTHOR). Changed files:"
          git diff --name-only "$BASE" "$HEAD" | tee changed.txt
          if grep -Ev '^(06-demo-app/manifests/|incidents/)' changed.txt; then
            echo "::error::The AI agent may only change 06-demo-app/manifests/ and incidents/. Files above are out of scope."
            exit 1
          fi
          echo "Scope OK."
