[project]
name = "ai-sre-agent"
version = "1.0.0"
description = "Read-only Kubernetes incident diagnosis agent that proposes GitOps PRs for human review"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=0.40",
  "requests>=2.31",
  "PyYAML>=6.0",
  "PyJWT[crypto]>=2.8",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ai-sre-agent = "ai_sre_agent.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ai_sre_agent"]
