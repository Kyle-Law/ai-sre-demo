# Identity for the AI SRE agent.
#
# Design rules:
#   * read verbs only: get / list / watch
#   * NO secrets anywhere, NO pods/exec, pods/attach, pods/portforward,
#     NO serviceaccounts/token, NO impersonation
#   * ConfigMaps are readable only in the namespace the agent remediates (shop)
#   * ArgoCD Applications readable only in the argocd namespace (to check sync)
#
# The kubeconfig handed to the agent is minted from this ServiceAccount by
# 09-agent-access/generate-agent-kubeconfig.sh (short-lived, bound token).
# 09-agent-access/verify-rbac.sh proves every allow / deny below.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-sre-agent
  namespace: ai-sre
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-sre-agent-readonly
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - events
      - services
      - endpoints
      - nodes
      - namespaces
      - persistentvolumeclaims
      - persistentvolumes
      - replicationcontrollers
      - resourcequotas
      - limitranges
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets", "controllerrevisions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-sre-agent-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ai-sre-agent-readonly
subjects:
  - kind: ServiceAccount
    name: ai-sre-agent
    namespace: ai-sre
---
# ConfigMaps can hold sensitive values, so they are only readable in the
# namespace the agent is responsible for.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-sre-agent-config-reader
  namespace: shop
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-sre-agent-config-reader
  namespace: shop
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ai-sre-agent-config-reader
subjects:
  - kind: ServiceAccount
    name: ai-sre-agent
    namespace: ai-sre
---
# Lets the agent confirm that ArgoCD has synced a merged fix.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-sre-agent-argocd-reader
  namespace: argocd
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-sre-agent-argocd-reader
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ai-sre-agent-argocd-reader
subjects:
  - kind: ServiceAccount
    name: ai-sre-agent
    namespace: ai-sre
