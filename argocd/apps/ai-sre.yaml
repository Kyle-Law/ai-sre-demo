# The agent's read-only RBAC identity and the Grafana -> Jira alert bridge.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-sre
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_GITHUB_ORG/ai-sre-demo.git
    targetRevision: main
    path: platform/ai-sre
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-sre
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
