# kube-prometheus-stack (Prometheus + kube-state-metrics + Grafana).
# Alertmanager is disabled: Grafana-managed alerting raises the Jira tickets.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 92.10.1
      helm:
        releaseName: kps
        valueFiles:
          - $values/platform/monitoring/values.yaml
    - repoURL: https://github.com/YOUR_GITHUB_ORG/ai-sre-demo.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
