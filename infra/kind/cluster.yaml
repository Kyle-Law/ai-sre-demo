# Single-node kind cluster for the demo. Grafana and ArgoCD NodePorts are
# mapped to localhost so the agent (running on the host) and your browser can
# reach them. The Kubernetes API is published on 127.0.0.1 by kind itself.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ai-sre
networking:
  apiServerAddress: 127.0.0.1
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30300 # Grafana
        hostPort: 30300
        listenAddress: 127.0.0.1
      - containerPort: 30443 # ArgoCD UI
        hostPort: 30443
        listenAddress: 127.0.0.1
