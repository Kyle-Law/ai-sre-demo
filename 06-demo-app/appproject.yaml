# Guardrail: anything merged under 06-demo-app/manifests can only land in the "shop"
# namespace and can never create RBAC, Secrets or cluster-scoped objects
# (other than its own Namespace). Even an approved-but-bad agent PR cannot
# escalate privileges through ArgoCD.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: shop
  namespace: argocd
spec:
  description: Customer-facing demo workloads. Target of AI-agent remediation PRs.
  sourceRepos:
    - https://github.com/Kyle-Law/ai-sre-demo.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: shop
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceBlacklist:
    - group: ""
      kind: Secret
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
    - group: ""
      kind: ServiceAccount
