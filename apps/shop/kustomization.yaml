apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# "checkout" is the demo workload. It is podinfo (a tiny Go web service) with a
# simulated 96 MB in-memory catalog cache. Scenarios in scenarios/ break this
# directory with realistic-looking commits; the AI agent proposes fixes here.
resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
